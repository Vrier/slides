<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<!-- Served by Caddy for any missing page on slides.tstephen.com (handle_errors in
     Vrier/compose deploy/Caddyfile). Self-contained: no local links, so it works at any path. -->
<style>
  :root{
    --tcd-blue:#0569b9;
    --tcd-ink:#07284a;
    --rule:#d9dee4;
    --muted:#4a5563;
  }
  html,body{margin:0;}
  body{min-height:100vh;display:grid;place-items:center;background:#fff;color:var(--tcd-ink);
    font-family:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,sans-serif;font-size:1.15rem;line-height:1.55;}
  main{padding:48px 24px;max-width:34rem;border-top:4px solid var(--tcd-blue);}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;font-size:0.8rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--tcd-blue);margin:18px 0 14px;}
  h1{font-family:"STIX Two Text",Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(2.2rem,6vw,3rem);
    line-height:1.05;margin:0 0 16px;}
  p{margin:0 0 12px;color:var(--muted);}
  .who{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);font-size:0.95rem;}
  a{color:var(--tcd-blue);}
  a:focus-visible{outline:2px solid var(--tcd-blue);outline-offset:3px;}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · Teaching materials</p>
  <h1>Page not found</h1>
  <p>This page does not exist, or it has moved.</p>
  <p>Check the link on Blackboard.</p>
  <p class="who">Dr Thomas Stephen · Trinity College Dublin · <a href="https://www.tstephen.com/">www.tstephen.com</a></p>
</main>
</body>
</html>
